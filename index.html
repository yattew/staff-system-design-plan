te (TPM) and requests-per-minute (RPM) per enterprise tenant."], "drill": "Design an enterprise AI Gateway that handles 200 corporate clients, enforces strict token rate limits, caches 40% of queries via semantic cache, and guarantees 99.99% uptime with multi-provider failover.", "trap": ""}, {"num": "36", "dates": "Jul 26 \u2013 Aug 01, 2027", "name": "Multi-LoRA Serving at Scale (S-LoRA & Punica)", "readings": "Sheng et al. Paper: *S-LoRA: Serving Thousands of Concurrent LoRA Adapters* (UC Berkeley).", "deep_dive": ["The Multi-Tenant customization problem: Why loading separate models per tenant kills GPU memory.", "Dynamic LoRA adapter swapping: Batching requests with different LoRA adapters on a single frozen base model.", "Memory pool management for dynamic adapter weights in GPU RAM."], "drill": "Design an enterprise multi-tenant fine-tuning platform where 1,000 enterprise customers can run custom LoRA adapters on top of Llama-3 with instant cold-start loading (< 50ms).", "trap": ""}]}, {"title": "Phase 9: Vector Databases, Billion-Scale RAG & Multimodal AI (Weeks 37 \u2013 39)", "weeks": [{"num": "37", "dates": "Aug 02 \u2013 Aug 08, 2027", "name": "Vector Database Internals (HNSW vs. IVF-PQ)", "readings": "Malkov & Yashunin Paper: *Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs (HNSW)*; DiskANN Paper (Microsoft).", "deep_dive": ["Approximate Nearest Neighbor (ANN) search algorithms.", "HNSW: Graph skip-lists, entry points, memory overhead (1.5x vector size in RAM).", "IVF-PQ: Inverted file list, product quantization, compression ratios, disk-backed search.", "Specialized Vector DBs (Milvus, Qdrant) vs. pgvector internals."], "drill": "Architect a vector search index for 1 Billion 1536-dimensional vectors. Calculate the exact RAM requirement for raw HNSW vs. IVF-PQ. Defend when you would choose pgvector over a standalone Milvus cluster.", "trap": ""}, {"num": "38", "dates": "Aug 09 \u2013 Aug 15, 2027", st, walk me through what fails and what stays up.\"*", "3. *\"Explain why you chose Kafka + Flink over a simple Celery + Redis queue for this pipeline.\"*", "Finalize resume highlighting enterprise AI platform achievements, scale, throughput, and reliability metrics.", "Launch live applications on **TokyoDev** and **Japan Dev** to **Mercari, PayPay, Woven by Toyota, and Line Yahoo**."], "drill": "", "trap": ""}]}];
    let completedWeeks = JSON.parse(localStorage.getItem('completed_weeks') || '{}');

    function saveState() {
      localStorage.setItem('completed_weeks', JSON.stringify(completedWeeks));
      updateProgress();
    }

    function toggleWeek(wNum) {
      completedWeeks[wNum] = !completedWeeks[wNum];
      saveState();
      const card = document.getElementById('week-card-' + wNum);
      const checkbox = document.getElementById('chk-' + wNum);
      if (checkbox) checkbox.checked = !!completedWeeks[wNum];
      if (card) {
        if (completedWeeks[wNum]) {
          card.classList.add('completed-card');
        } else {
          card.classList.remove('completed-card');
        }
      }
    }

    function updateProgress() {
      const total = 40;
      let count = 0;
      for (let i = 1; i <= total; i++) {
        if (completedWeeks[i]) count++;
      }
      const pct = Math.round((count / total) * 100);
      document.getElementById('progress-text').innerText = count + ' / ' + total + ' Weeks Completed (' + pct + '%)';
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    function resetProgress() {
      if (confirm('Are you sure you want to reset all progress checkmarks?')) {
        completedWeeks = {};
        saveState();
        render();
      }
    }

    function expandAll() {
      document.querySelectorAll('.phase-content').forEach(el => el.classList.remove('hidden'));
      document.querySelectorAll('.phase-chevron').forEach(el => el.style.transform = 'rotate(180deg)');
    }

    function collapseAll() {
      document.querySelectorAll('.phase-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.phase-chevron').forEach(el => el.style.transform = 'rotate(0deg)');
    }

    function togglePhase(idx) {
      const content = document.getElementById('phase-content-' + idx);
      const chevron = document.getElementById('phase-chevron-' + idx);
      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
      } else {
        content.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
      }
    }

    function render() {
      const container = document.getElementById('phasesContainer');
      container.innerHTML = '';

      phasesData.forEach((phase, pIdx) => {
        const phaseDiv = document.createElement('div');
        phaseDiv.className = 'glass-card rounded-2xl overflow-hidden border border-slate-800 shadow-xl';

        // Phase Header
        const header = document.createElement('div');
        header.className = 'p-5 bg-slate-900/70 border-b border-slate-800/80 flex items-center justify-between cursor-pointer select-none hover:bg-slate-900/90 transition';
        header.onclick = () => togglePhase(pIdx);

        header.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="px-2.5 py-1 rounded-md bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 font-mono text-xs font-bold">P${pIdx + 1}</span>
            <h2 class="text-base md:text-lg font-bold text-white">${phase.title}</h2>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-slate-400">${phase.weeks.length} Weeks</span>
            <svg id="phase-chevron-${pIdx}" class="phase-chevron w-5 h-5 text-slate-400 transition-transform duration-200" style="transform: rotate(180deg)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        `;
        phaseDiv.appendChild(header);

        // Phase Content (Grid of Weeks)
        const content = document.createElement('div');
        content.id = 'phase-content-' + pIdx;
        content.className = 'phase-content p-5 grid grid-cols-1 gap-5';

        phase.weeks.forEach(w => {
          const isDone = !!completedWeeks[w.num];
          const weekCard = document.createElement('div');
          weekCard.id = 'week-card-' + w.num;
          weekCard.className = `p-5 rounded-xl border border-slate-800 bg-slate-900/40 hover:border-slate-700/80 transition duration-200 ${isDone ? 'completed-card' : ''}`;

          let deepDiveHtml = '';
          if (w.deep_dive && w.deep_dive.length > 0) {
            deepDiveHtml = `
              <div class="mt-3">
                <div class="text-[11px] uppercase tracking-wider font-bold text-slate-400 mb-1.5">Key Concepts to Dissect:</div>
                <ul class="space-y-1 text-xs text-slate-300 list-disc list-inside">
                  ${w.deep_dive.map(item => `<li>${item}</li>`).join('')}
                </ul>
              </div>
            `;
          }

          let drillHtml = '';
          if (w.drill) {
            drillHtml = `
              <div class="mt-3 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-xs">
                <span class="font-bold text-emerald-400 uppercase tracking-wide text-[10px] block mb-1">🛠️ Staff Architecture Drill</span>
                <span class="text-slate-200">${w.drill}</span>
              </div>
            `;
          }

          let trapHtml = '';
          if (w.trap) {
            trapHtml = `
              <div class="mt-2.5 p-3 rounded-lg bg-amber-500/10 border border-amber-500/20 text-xs">
                <span class="font-bold text-amber-400 uppercase tracking-wide text-[10px] block mb-1">⚠️ Interview Trap / Edge Case</span>
                <span class="text-slate-200">${w.trap}</span>
              </div>
            `;
          }

          weekCard.innerHTML = `
            <div class="flex items-start justify-between gap-4">
              <div class="flex items-start gap-3">
                <input type="checkbox" id="chk-${w.num}" onchange="toggleWeek('${w.num}')" ${isDone ? 'checked' : ''} class="mt-1 w-4 h-4 rounded text-emerald-500 focus:ring-emerald-500 bg-slate-950 border-slate-700 cursor-pointer">
                <div>
                  <div class="flex flex-wrap items-center gap-2 mb-1">
                    <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-[11px] font-semibold">Week ${w.num}</span>
                    <span class="text-xs text-cyan-400 font-mono font-medium">${w.dates}</span>
                  </div>
                  <h3 class="text-base font-bold text-white">${w.name}</h3>
                </div>
              </div>
            </div>

            ${w.readings ? `
              <div class="mt-3 text-xs text-slate-300">
                <span class="font-semibold text-slate-400">📖 Reading:</span> <span class="text-slate-200 font-medium">${w.readings}</span>
              </div>
            ` : ''}

            ${deepDiveHtml}
            ${drillHtml}
            ${trapHtml}
          `;

          content.appendChild(weekCard);
        });

        phaseDiv.appendChild(content);
        container.appendChild(phaseDiv);
      });

      updateProgress();
    }

    function filterWeeks() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('[id^="week-card-"]').forEach(card => {
        const text = card.innerText.toLowerCase();
        if (text.includes(query)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    render();
  </script>
